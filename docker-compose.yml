services:
  qdrant:
    image: qdrant/qdrant:v1.16.2
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
      QDRANT__SERVICE__MAX_REQUEST_SIZE_MB: "16"
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  qdrant_storage:
