# Pipeline thí sinh; độc lập với configs/eval.toml (bộ chấm chính thức).
[models]
embedding = "intfloat/multilingual-e5-small"
embedding_revision = "614241f622f53c4eeff9890bdc4f31cfecc418b3"
reranker = "cross-encoder/mmarco-mMiniLMv2-L12-H384-v1"
reranker_revision = "1427fd652930e4ba29e8149678df786c240d8825"
device = "cpu"
embedding_backend = "local" # đổi thành "gateway" để đối chứng bge-m3
batch_size = 8
cpu_threads = 4

[ingestion]
chunk_size = 300           # token của tokenizer embedding local
chunk_overlap = 40

[retrieval]
query_normalization = true
expanded_candidates = 40
rerank_weight = 0.85
dense_k = 20
bm25_k = 20
rerank_k = 30
rrf_constant = 60
max_retrieved = 10

[generation]
budget_start = "2026-11-03T15:20:11.825428+00:00"
max_live_requests = 260
context_docs = 8
context_token_budget = 12000 # proxy bảo thủ: số byte UTF-8, không phải tokenizer Claude
max_tokens = 1536
max_answer_chars = 2000
request_timeout = 25.0
max_attempts = 3
request_interval = 1.0     # tối đa 60 request/phút trong một process
cache_path = ".cache/hybrid_generation.sqlite"

[qdrant]
url = "http://localhost:6333"
collection_prefix = "neorag_hybrid"
