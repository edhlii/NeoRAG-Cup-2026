# Pipeline thí sinh; độc lập với configs/eval.toml (bộ chấm chính thức).
[models]
embedding = "intfloat/multilingual-e5-small"
embedding_revision = "614241f622f53c4eeff9890bdc4f31cfecc418b3"
reranker = "cross-encoder/mmarco-mMiniLMv2-L12-H384-v1"
reranker_revision = "1427fd652930e4ba29e8149678df786c240d8825"
device = "cpu"
embedding_backend = "gateway" # dense: bge-m3 BTC; E5 local giữ tokenizer/chunking
batch_size = 8
cpu_threads = 4

[ingestion]
chunk_size = 300           # token của tokenizer embedding local
chunk_overlap = 40

[retrieval]
max_query_tokens = 512
rerank_mode = "norm"
rerank_pool = "hybrid"
batch_queries = true
query_normalization = true
expanded_candidates = 40
fusion_mode = "minmax"
rerank_weight = 0.5
dense_k = 20
bm25_k = 20
rerank_k = 30
rrf_constant = 60
max_retrieved = 10

[generation]
prompt_version = "precise"
explanatory_abstention = true
diversify_context = true
budget_start = "2026-11-04T01:44:28.239116+00:00"
max_live_requests = 400
context_docs = 6
context_token_budget = 9000 # proxy bảo thủ: số byte UTF-8, không phải tokenizer Claude
max_tokens = 2048
max_answer_chars = 2000
request_timeout = 45.0
max_attempts = 3
request_interval = 1.0     # tối đa 60 request/phút trong một process
cache_path = ".cache/hybrid_generation.sqlite"

[qdrant]
url = "http://localhost:6333"
collection_prefix = "neorag_hybrid"
