[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "neorag"
version = "2026.1.0"
description = "Starter kit và bộ chấm chính thức của NeoRAG Cup 2026 - Team AI, CLB Lập Trình PTIT"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Team AI - CLB Lập Trình PTIT" }]
dependencies = [
    "numpy>=1.26",
    "openai>=1.40",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
app = ["streamlit>=1.36"]
local = ["sentence-transformers>=3.0"]  # embedding/reranker chạy trên máy: scripts/install.py --local
dev = ["pytest>=8.0", "ruff>=0.6", "pre-commit>=3.7"]
hybrid = [
    "torch>=2.0",
    "transformers==5.22.1",
    "huggingface-hub>=0.34,<3",
    "langchain-core==1.7.4",
    "langchain-text-splitters==1.1.3",
    "langsmith==0.14.17",
    "uuid-utils>=0.12,<1",  # tương thích langsmith; tránh resolver backtracking
    "qdrant-client>=1.16,<1.17",
    "rank-bm25>=0.2.2,<0.3",
    "tenacity>=9,<10",
]

[project.scripts]
neorag = "neorag.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/neorag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "app"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]
